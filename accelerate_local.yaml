# Local single/multi-GPU configuration for the installed PyTorch wheel.
# Keep optimizer state on GPU: CPU offload makes DeepSpeed build CPUAdam, which
# requires compiling a CUDA extension and fails when the host toolkit (13.0)
# differs from the cu128 PyTorch wheel.
main_process_port: 13378

compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  zero_stage: 2
  overlap_comm: true
  contiguous_gradients: true
  gradient_clip: 1
  gradient_accumulation_steps: 'auto'
distributed_type: DEEPSPEED
downcast_bf16: 'auto'
machine_rank: 0
main_training_function: main
mixed_precision: 'bf16'
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
